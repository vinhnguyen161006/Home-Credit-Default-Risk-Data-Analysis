[project]
name = "hcr"
version = "0.1.0"
description = "Home Credit default risk scoring pipeline"
requires-python = "==3.12.*"

dependencies = [
    "duckdb==1.1.3",
    "polars==1.17.1",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "numpy==2.1.3",
    "scikit-learn==1.6.0",
    "lightgbm==4.5.0",
    "shap==0.46.0",
    "mlflow==2.19.0",
    "pandera==0.21.1",
    "pyyaml==6.0.2",
    "python-dotenv==1.0.1",
    "pyodbc==5.2.0",
    "sqlalchemy==2.0.36",
    "matplotlib==3.9.3",
    "typer==0.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "pandas-stubs==2.2.3.241126",
    "types-pyyaml==6.0.12.20240917",
    "jupyterlab==4.3.4",
]

[project.scripts]
hcr = "hcr.pipeline.run_all:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "PTH",
    "SIM",
    "TRY",
    "RUF",
    "D",
    "ANN",
    "G",
    "T20",
    "ERA",
    "PD",
    "NPY",
]
ignore = [
    "D203",
    "D213",
    "D405",
    "ANN401",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "ANN201", "ANN001"]
"notebooks/**" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/hcr"]
plugins = []
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["duckdb.*", "lightgbm.*", "shap.*", "mlflow.*", "pandera.*", "pyodbc.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running SQL Server instance",
    "slow: runs against the full dataset rather than fixtures",
]

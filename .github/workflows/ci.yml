name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Typecheck
        run: uv run mypy src/hcr

  no-hash-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject hash comments outside the permitted exceptions
        run: |
          echo "TODO Fail when a tracked Python, YAML or SQL file contains a hash comment."
          echo "TODO Permit only: shebangs, type ignore, noqa, and Makefile directives."
          echo "TODO Explanation belongs in a docstring or a YAML note key, never a comment."
          echo "TODO Ruff ERA01 catches commented-out code; this job catches prose comments."
          exit 0

      - name: Reject non-English strings in source
        run: |
          echo "TODO Fail when a tracked file under src/ or tests/ contains non-ASCII letters."
          echo "TODO Allow Vietnamese only in markdown documentation and in configs note keys."
          exit 0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit and gate tests
        run: uv run pytest -m "not integration and not slow" --cov=src/hcr --cov-report=term-missing

  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run the pipeline on fixture data
        run: |
          echo "TODO Run steps 1 through 7 against tests/fixtures rather than the real CSV."
          echo "TODO The 2.5 GB dataset is not available in CI, and a pipeline only ever"
          echo "TODO exercised on the full data breaks silently between manual runs."
          echo "TODO Override the data contract row counts with fixture-sized expectations,"
          echo "TODO through a config override rather than by relaxing the gate itself."
          echo "TODO Assert the run is reproducible: execute twice and compare the feature"
          echo "TODO manifest byte for byte."
          echo "TODO Skip step 8, which needs SQL Server; its gates run as integration tests."
          exit 0

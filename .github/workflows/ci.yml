name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Typecheck
        run: uv run mypy src/hcr

  source-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Reject hash comments and non-English source text
        run: uv run pytest tests/unit/test_source_rules.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit and gate tests
        run: uv run pytest -m "not integration and not slow" --cov=src/hcr --cov-report=term-missing

  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the pipeline on fixture data
        run: |
          echo "TODO Run steps 1 through 7 against tests/fixtures rather than the real CSV."
          echo "TODO The 2.5 GB dataset is not available in CI, and a pipeline only ever"
          echo "TODO exercised on the full data breaks silently between manual runs."
          echo "TODO Override the data contract row counts with fixture-sized expectations,"
          echo "TODO through a config override rather than by relaxing the gate itself."
          echo "TODO Assert the run is reproducible: execute twice and compare the feature"
          echo "TODO manifest byte for byte."
          echo "TODO Skip step 8, which needs SQL Server; its gates run as integration tests."
          exit 0

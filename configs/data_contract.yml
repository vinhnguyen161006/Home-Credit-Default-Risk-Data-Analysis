expected_coverage:
  rationale: >-
    Coverage gaps the join logic must tolerate. Checked as warnings, never as
    stops: they describe the data, they are not defects. They are the reason
    every join is a LEFT JOIN from the parent table.
  definitions_note: >-
    Measured on the source files. bureau_rows_with_balance counts bureau rows
    whose SK_ID_BUREAU has at least one bureau_balance row, 45.1 percent of the
    table. train_customers_with_bureau_history counts application_train
    customers with at least one bureau row, which leaves 44020 customers, 14.3
    percent, with no bureau record. The specification quotes 817395 and 305811
    instead; those are distinct SK_ID_BUREAU values in bureau_balance, including
    43041 absent from bureau, and distinct SK_ID_CURR in bureau across train and
    test together.
  bureau_rows_total: 1716428
  bureau_rows_with_balance: 774354
  train_customers_total: 307511
  train_customers_with_bureau_history: 263491

target:
  column: TARGET
  positive_count: 24825
  negative_count: 282686
  positive_rate: 0.0807
  note: >-
    Roughly 11.4 negatives per positive. Accuracy is therefore banned as a
    metric: predicting all zeros scores 91.93 percent while catching no default.

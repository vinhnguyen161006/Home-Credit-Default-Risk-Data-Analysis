meta:
  step: 2
  purpose: Expected shape of every raw source table, asserted before any transform.
  rationale: >-
    Row and column counts come from the system specification. Any mismatch stops
    the pipeline, because a changed source file invalidates every downstream
    count and every number in the result document.

